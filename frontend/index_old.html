<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>NeuralForge</title>

    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <div class="app-container">

        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">

            <div class="brand">
                <div class="brand-icon">N</div>

                <div>
                    <h2>NeuralForge</h2>
                    <span>AI Workspace</span>
                </div>
            </div>

            <button class="new-chat-button" id="newChatButton">
                <span>＋</span> New conversation
            </button>

            <div class="sidebar-heading">
                YOUR CONVERSATIONS
            </div>

            <div class="session-list" id="sessionList">
                <!-- Sessions populated by JavaScript -->
            </div>

            <div class="sidebar-footer">
                <div class="status-dot"></div>
                <span>Local backend connected</span>
            </div>

        </aside>


        <!-- Main workspace -->
        <main class="main-content">

            <header class="topbar">

                <button class="mobile-menu" id="mobileMenu">
                    ☰
                </button>

                <div class="model-info">
                    <div class="model-indicator"></div>

                    <div>
                        <strong>Qwen 2.5 7B</strong>
                        <span>Instruct Model</span>
                    </div>
                </div>

                <div class="topbar-right">
                    <span class="environment-label">DEVELOPMENT</span>
                </div>

            </header>


            <!-- Chat area -->
            <section class="chat-area" id="chatArea">

                <div class="welcome-screen" id="welcomeScreen">

                    <div class="welcome-icon">✦</div>

                    <h1>What can I help you build?</h1>

                    <p>
                        Your personal AI workspace, powered by
                        cloud-hosted language models.
                    </p>

                    <div class="suggestion-grid">

                        <button class="suggestion-card"
                            data-prompt="Explain how a Kalman filter works.">
                            <span>◈</span>
                            <strong>Explore a concept</strong>
                            <small>Understand technical topics</small>
                        </button>

                        <button class="suggestion-card"
                            data-prompt="Help me debug a Python program.">
                            <span>⌘</span>
                            <strong>Debug code</strong>
                            <small>Find and fix programming errors</small>
                        </button>

                        <button class="suggestion-card"
                            data-prompt="Explain the architecture of a transformer model.">
                            <span>⌬</span>
                            <strong>Learn AI</strong>
                            <small>Explore machine learning concepts</small>
                        </button>

                        <button class="suggestion-card"
                            data-prompt="Suggest an interesting systems programming project.">
                            <span>⚙</span>
                            <strong>Build something</strong>
                            <small>Discover engineering ideas</small>
                        </button>

                    </div>

                </div>


                <div class="messages-container" id="messagesContainer">
                    <!-- Chat messages populated by JavaScript -->
                </div>

            </section>


            <!-- Input area -->
            <footer class="input-section">

                <div class="input-wrapper">

                    <textarea
                        id="messageInput"
                        placeholder="Message NeuralForge..."
                        rows="1"
                    ></textarea>

                    <button id="sendButton" class="send-button"
                        title="Send message">
                        ↑
                    </button>

                </div>

                <div class="input-disclaimer">
                    NeuralForge can make mistakes. Verify important information.
                </div>

            </footer>

        </main>

    </div>

    <script src="/static/script.js"></script>

</body>
</html>
